# Monta o aplicativo Android (APK) do Prancheta toda vez que o jogo for atualizado neste ramo.
# Download fixo: https://github.com/ivohermogenes16-hash/wildforge/releases/download/prancheta-apk/prancheta.apk
name: Gerar APK Prancheta

on:
  push:
    branches: [prancheta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas do Android e o Gradle
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmd.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Copiar o jogo para dentro do app
        run: |
          mkdir -p android/app/src/main/assets
          cp -r app/index.html app/css app/js app/m3d android/app/src/main/assets/

      - name: Montar o APK
        working-directory: android
        env:
          VCODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar o arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk prancheta.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prancheta-apk
          target_commitish: ${{ github.sha }}
          name: Prancheta (versão ${{ github.run_number }})
          body: Baixe o arquivo **prancheta.apk** abaixo e instale no Android. Para atualizar, instale por cima da versão antiga (sua carreira continua salva).
          files: prancheta.apk
          make_latest: false
          overwrite_files: true
