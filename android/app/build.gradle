plugins {
    id 'com.android.application'
}

// número da versão vem da montagem no GitHub (cada montagem nova é uma versão nova)
def vcode = (System.getenv("VCODE") ?: "1") as Integer
// APK do site continua no Android 34; o arquivo da Google Play (AAB) é montado mirando o Android 36, como a Play exige
def csdk = (System.getenv("CSDK") ?: "34") as Integer
def tsdk = (System.getenv("TSDK") ?: "34") as Integer

android {
    namespace 'io.github.prancheta'
    compileSdk csdk

    defaultConfig {
        applicationId "com.lumbragames.prancheta"
        minSdk 24
        targetSdk tsdk
        versionCode vcode
        versionName "1." + vcode
        // código do app no AdMob (anúncios com recompensa)
        manifestPlaceholders = [admobAppId: (System.getenv("ADMOB_APP_ID") ?: "ca-app-pub-8449786356389316~5311009644")]
    }

    signingConfigs {
        release {
            // a chave fica criptografada no repositório e só é aberta na montagem,
            // com a senha guardada nos "Secrets" do GitHub (LUMBRA_KEY_PASS)
            storeFile file("../lumbra.keystore")
            storePassword System.getenv("LUMBRA_KEY_PASS")
            keyAlias "lumbra"
            keyPassword System.getenv("LUMBRA_KEY_PASS")
            // assinaturas antiga (v1) e novas (v2/v3): algumas lojas exigem a v1
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.guava:guava:33.3.1-android'
    // 6.2: entrar com Google (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
