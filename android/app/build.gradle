plugins {
    id 'com.android.application'
}

// número da versão vem da montagem no GitHub (cada montagem nova é uma versão nova)
def vcode = (System.getenv("VCODE") ?: "1") as Integer

android {
    namespace 'io.github.wildforge'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.ivohermogenes16.wildforge"
        minSdk 24
        targetSdk 34
        versionCode vcode
        versionName "1." + vcode
    }

    signingConfigs {
        release {
            storeFile file("../wildforge.keystore")
            storePassword "wildforge-vale"
            keyAlias "wildforge"
            keyPassword "wildforge-vale"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
